       khong the lam anh preview rieng cho tung phim (bot khong chay JS) -

       trong/xau, con hon la khong co gi. -->

  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="MiloxZizi Film - Xem phim online miễn phí"/>

  <link rel="preconnect" href="https://phimimg.com"/>

</head>
<body>
  <div id="header-container"></div>

  <div id="heroContainer"></div>

  <main>
    <section id="continueSection" style="display:none;">
      <h2 class="section-title">▶ Xem tiếp</h2>
      <div id="continueList" class="movie-grid"></div>
    </section>

    <h2 class="section-title">🔥 Phim mới cập nhật</h2>
    <div id="movieList" class="movie-grid"></div>

    <div id="pagination" class="pagination"></div>
  </main>

  <div id="footer-container"></div>

  <script src="js/auth.js?v=20261018r10"></script>
  <script src="js/api.js?v=20261018r10"></script>
  <script src="js/storage.js?v=20261018r10"></script>
  <script src="js/common.js?v=20261018r10"></script>
  <script>
    document.getElementById('header-container').innerHTML = renderHeader('home');
    document.getElementById('footer-container').innerHTML = renderFooter();

    let currentPage = parseInt(getQueryParam('page')) || 1;

    async function loadPage(page) {
      currentPage = page;
      showSkeleton('movieList');
      document.getElementById('pagination').innerHTML = '';

      // Trang 1: load hero banner + phim mới + mục "Xem tiếp"
      if (page === 1) {
        document.getElementById('heroContainer').innerHTML = '<div class="hero-skeleton"></div>';
        try {
          const n = renderContinueWatching('continueList');
          document.getElementById('continueSection').style.display = n > 0 ? '' : 'none';
        } catch (e) {}
      }

      const { items, pagination } = await getNewMovies(page);

      // Render hero banner ở trang 1
      if (page === 1 && items.length > 0) {
        document.getElementById('heroContainer').innerHTML = renderHeroBanner(items);
        initHeroSlider();
      } else {
        document.getElementById('heroContainer').innerHTML = '';
      }

      hideSkeleton('movieList');
      renderMovieList(items, 'movieList');
      renderPagination(pagination, loadPage, 'pagination');
    }

    loadPage(currentPage);
  </script>
</body>
</html>
