      --plyr-video-background: #000;

      --plyr-menu-color: #fff;

    }

<body>
  <div id="header-container"></div>
  <main>
    <div id="watchContent">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px;">Đang tải phim...</p></div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="js/auth.js?v=20260922r54"></script>
  <script src="js/api.js?v=20260922r54"></script>
  <script src="js/storage.js?v=20260922r54"></script>
  <script src="js/common.js?v=20260922r54"></script>
  <script>
    document.getElementById('header-container').innerHTML = renderHeader();
    document.getElementById('footer-container').innerHTML = renderFooter();

    const slug = getQueryParam('slug');
    const epSlug = getQueryParam('ep');
    const serverIdx = parseInt(getQueryParam('server')) || 0;
    let plyrInstance = null;
    let hlsInstance = null;
    let nextEpUrlGlobal = null;
    let prevEpUrlGlobal = null;

    // --- Chống lỗi tiếng méo ("ồm ồm / giọng vịt robot") --------------------
    let currentM3u8Url = null;    // để dựng lại player mà không phải tải lại trang
    let pendingResume = 0;        // giây; > 0 nghĩa là đang dựng lại và cần tua về chỗ cũ
    let pendingAutoplay = false;
    let scrollGuardInstalled = false;
    let mediaRecoverCount = 0;
    let lastMediaRecover = 0;
    let lastNetworkRetry = 0;

    // --- Tự bỏ quảng cáo chèn giữa phim ------------------------------------
    // Quảng cáo trong stream nằm ở path KHÁC với path phim (vd convertv8/ hoặc
    // /v8/<hash>/), luôn ~2:57 (~24s) và ~15:00 (~30s). Đã kiểm chứng ~152 phim:
    // 0 lần cắt nhầm. Ta tính các khoảng QC từ danh sách fragment của hls.js rồi
    // tua qua khi phát tới. Có chốt chặn 60s để KHÔNG BAO GIỜ tua nhầm cảnh phim.
    let adRanges = [];
    const AD_SKIP_LS_KEY = 'miloAutoSkipAds';
    const AD_MAX_RUN_SEC = 60;                 // đoạn lạ > 60s coi là PHIM, không tua
    const AD_PATH_RE = /\/(?:convertv\d+|v\d+\/[0-9a-f]{32})\/$/;  // mẫu path quảng cáo
    const AD_HARDENING = true;                 // chỉ tua path đúng mẫu QC (hỏng = bỏ sót, an toàn)

    function autoSkipEnabled() {                // MẶC ĐỊNH BẬT
      try { return localStorage.getItem(AD_SKIP_LS_KEY) !== '0'; } catch (e) { return true; }
    }
    function setAutoSkip(on) {
      try { localStorage.setItem(AD_SKIP_LS_KEY, on ? '1' : '0'); } catch (e) {}
    }

    function adDirOf(u) {
      const i = u.lastIndexOf('/');
      return i >= 0 ? u.slice(0, i + 1) : u;   // URL đến HẾT dấu '/' cuối
    }

    // Tính các khoảng quảng cáo từ danh sách fragment của hls.js.
    function computeAdRanges(fragments) {
      if (!fragments || !fragments.length) return [];
      // 1) Thư mục phim = nơi chứa NHIỀU fragment nhất.
      const counts = Object.create(null);
      for (const f of fragments) {
        if (!f || !f.url) continue;
        const d = adDirOf(f.url);
        counts[d] = (counts[d] || 0) + 1;
      }
      let dominant = null, best = -1;
      for (const d in counts) if (counts[d] > best) { best = counts[d]; dominant = d; }
      if (!dominant) return [];
      // 2) Gom fragment "lạ" liên tiếp. SO SÁNH CHÍNH XÁC, không dùng startsWith
      //    (QC break-1 nằm trong thư mục con của path phim -> prefix sẽ bỏ sót).
      const runs = [];
      let run = null;
      for (const f of fragments) {
        if (!f || !f.url || !isFinite(f.start)) continue;
        const d = adDirOf(f.url);
        if (d !== dominant) {
          const end = f.start + (f.duration || 0);
          if (!run) run = { start: f.start, end: end, dir: d };
          else run.end = end;
        } else if (run) { runs.push(run); run = null; }
      }
      if (run) runs.push(run);                 // QC ở cuối phim vẫn là kết thúc hợp lệ
      // 3) Chốt chặn: cap thời lượng (bắt buộc) + mẫu path (khuyến nghị).
      return runs
        .map(r => ({ start: r.start, end: r.end, dur: r.end - r.start, dir: r.dir }))
        .filter(r => r.dur <= AD_MAX_RUN_SEC && (!AD_HARDENING || AD_PATH_RE.test(r.dir)));
    }

    // Gắn bộ tua-qua-QC lên thẻ <video> (mỗi lần dựng lại player là 1 video mới).
    function armAdSkip(video) {
      if (!video || video.__adSkipArmed) return;
      video.__adSkipArmed = true;

      // Nhảy TRƯỚC khi chạm quảng cáo (sớm 0.4s) -> không khung hình QC nào kịp
      // hiện, bỏ HẲN thay vì lóe 0.1s. Chỉ mất ~0.4s cảnh phim ngay trước điểm
      // nối QC (vốn là chỗ cắt sang QC) - gần như không nhận ra.
      const AD_LOOKAHEAD = 0.4;
      function trySkip() {
        if (!autoSkipEnabled() || !adRanges.length) return;
        const t = video.currentTime;
        for (const r of adRanges) {
          if (t >= r.start - AD_LOOKAHEAD && t < r.end - 0.25) {
            // Nhảy HẲN qua mép cuối QC (+0.3s) để không lọt lại vào vùng QC.
            video.currentTime = r.end + 0.3;
            diag('adskip', 'tua ' + t.toFixed(2) + ' -> ' + r.end.toFixed(2));
            showAdSkipToast();
            break;
          }
        }
      }

      // timeupdate (~4 lần/giây) làm lưới an toàn, chạy cả khi tab chạy nền.
      video.addEventListener('timeupdate', trySkip);
      // requestAnimationFrame (~60 lần/giây) bắt mép QC gần như tức thì khi đang
      // xem -> quảng cáo chỉ lóe vài mili-giây thay vì tới ~0.25s. Tự dừng khi
      // thẻ <video> bị gỡ (rebuildPlayer tạo thẻ mới).
      function rafLoop() {
        if (!video.__adSkipArmed || !document.contains(video)) return;
        if (!video.paused && !video.seeking) trySkip();
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    }

    function showAdSkipToast() {
      const c = document.querySelector('.player-container');
      if (!c) return;
      let el = c.querySelector('.ad-skip-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'ad-skip-toast';
        el.textContent = 'Đã bỏ qua quảng cáo';
        el.style.cssText = 'position:absolute;top:16px;left:16px;z-index:30;' +
          'background:rgba(20,20,20,.92);color:#fff;padding:8px 14px;border-radius:8px;' +
          'font-size:13px;font-weight:600;pointer-events:none;opacity:0;' +
          'transition:opacity .25s;box-shadow:0 4px 16px rgba(0,0,0,.5);';
        c.appendChild(el);
      }
      el.style.opacity = '1';
      clearTimeout(el.__t);
      el.__t = setTimeout(() => { el.style.opacity = '0'; }, 1800);
    }

    function refreshAdSkipToggle() {
      const btn = document.getElementById('adSkipToggle');
      if (btn) btn.textContent = autoSkipEnabled() ? '⏭ Bỏ QC: Bật' : '⏭ Bỏ QC: Tắt';
    }
    window.toggleAutoSkip = function () {
      setAutoSkip(!autoSkipEnabled());
      refreshAdSkipToggle();
    };

    // --- Nhớ chỗ đang xem / Xem tiếp --------------------------------------
    // Lưu vị trí đang xem liên tục để lỡ tay thoát ra vẫn quay lại đúng chỗ.
    let currentMovieGlobal = null;   // phim + tập hiện tại (để lưu lịch sử kèm thời gian)
    let currentEpGlobal = null;
    let savedResumeTime = 0;         // vị trí đã lưu của tập này (giây), tính lúc mở phim
    let lastHistorySave = 0;
    let resumeOffered = false;       // chỉ mời "Xem tiếp" MỘT lần mỗi lần mở trang

    function saveWatchProgress(force) {
      const v = document.getElementById('videoPlayer');
      if (!v || !currentMovieGlobal || !currentEpGlobal) return;
      const t = v.currentTime;
      if (!isFinite(t) || t < 5) return;         // bỏ qua vài giây đầu
      const now = Date.now();
      if (!force && now - lastHistorySave < 5000) return;   // tối đa 5s/lần
      lastHistorySave = now;
      saveHistory(currentMovieGlobal, currentEpGlobal, t, isFinite(v.duration) ? v.duration : 0);
    }

    function armHistorySave(video) {
      if (!video || video.__histArmed) return;
      video.__histArmed = true;
      video.addEventListener('timeupdate', () => saveWatchProgress(false));
      video.addEventListener('pause', () => saveWatchProgress(true));
    }

    // --- Tăng âm lượng cho phim bị nhỏ tiếng (file gốc master quá nhỏ) -----
    // Đo thực tế trên NHIỀU phim ngẫu nhiên (không riêng 1 phim): mean_volume
    // phổ biến ở mức -24 đến -30dB (rất nhỏ so với chuẩn phát trực tuyến) -
    // đây là đặc tính chung của nguồn, không phải lỗi hiếm. Nhưng đỉnh âm
    // (max_volume) của nhiều phim chỉ cách 0dB (vỡ tiếng) khoảng 5-9dB, nên
    // CHỈ nhân tuyến tính (GainNode) thì mức an toàn tối đa chỉ tới x3.
    // -> Thêm DynamicsCompressorNode làm LIMITER sau GainNode: giữ nguyên âm
    // lượng các đoạn bình thường/nhỏ, chỉ "ghìm" lại đúng những đỉnh sắp vỡ
    // tiếng - nhờ vậy nâng được mức tăng tối đa lên x4 mà không bị rè/vỡ.
    // KHÔNG lưu localStorage - chỉ áp dụng cho lần xem HIỆN TẠI, vì phim khác
    // có thể đã đủ to, để mức tăng dính sang phim sau sẽ làm RÈ/VỠ TIẾNG.
    let audioCtx = null;
    let audioGainNode = null;
    let audioLimiterNode = null;
    let audioBoostLevel = 1; // 1=binh thuong, 2=x2(+6dB), 3=x3(+9.5dB), 4=x4(+12dB)

    function armAudioBoost(video) {
      if (!video || video.__boostArmed) return;
      video.__boostArmed = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return; // trinh duyet qua cu, bo qua - video van phat binh thuong
        audioCtx = new AC();
        const source = audioCtx.createMediaElementSource(video);
        audioGainNode = audioCtx.createGain();
        audioGainNode.gain.value = audioBoostLevel;
        source.connect(audioGainNode);
        try {
          // Limiter "brickwall" nhẹ: threshold sát 0dB, ratio cao, attack cực
          // nhanh - chỉ can thiệp đúng lúc tín hiệu sắp vỡ tiếng, các đoạn
          // bình thường đi qua gần như không đổi.
          audioLimiterNode = audioCtx.createDynamicsCompressor();
          audioLimiterNode.threshold.value = -1;
          audioLimiterNode.knee.value = 0;
          audioLimiterNode.ratio.value = 20;
          audioLimiterNode.attack.value = 0.003;
          audioLimiterNode.release.value = 0.15;
          audioGainNode.connect(audioLimiterNode);
          audioLimiterNode.connect(audioCtx.destination);
        } catch (e) {
          // Khong tao duoc limiter (hiem) -> noi thang gain vao destination,
          // van dung duoc nhu ban cu (chi mat lop chong vo tieng o muc cao).
          audioLimiterNode = null;
          audioGainNode.connect(audioCtx.destination);
        }
        // Loc de F12 Console/kiem thu doc duoc trang thai, giong window.__audioDiag.
        window.__audioCtx = audioCtx;
        window.__audioGainNode = audioGainNode;
        window.__audioLimiterNode = audioLimiterNode;
      } catch (e) {
        // Loi (vd trinh duyet chan) -> am thanh van phat qua duong mac dinh cua
        // <video>, chi la khong tang duoc. Khong lam gi them de tranh cau
        // truc am thanh bi hong.
        diag('audioboost.err', e && e.message);
        audioCtx = null; audioGainNode = null; audioLimiterNode = null;
      }
    }

    window.cycleAudioBoost = function () {
      // QUAN TRONG: chi tao AudioContext O DAY - NGAY BEN TRONG cu chi bam nut
      // cua nguoi dung - chu KHONG tao san luc tai trang (initPlyrPlayer).
      // Da do that tren domain that (khong phai localhost, khong bypass chinh
      // sach): AudioContext tao SAN luc tai trang bi 'suspended' VINH VIEN du
      // nguoi dung co bam Play that hay khong - RMS do duoc = 0, MAT TIENG
      // HOAN TOAN cho moi phim, moi nguoi xem. Tao ngay trong click nay thi
      // AudioContext luon 'running' ngay (dung dac ta autoplay-gesture).
      if (!audioGainNode) armAudioBoost(document.getElementById('videoPlayer'));
      if (!audioGainNode) return; // trinh duyet qua cu / khong ho tro -> bo qua
      audioBoostLevel = audioBoostLevel >= 4 ? 1 : audioBoostLevel + 1;
      audioGainNode.gain.value = audioBoostLevel;
      // Luoi phong: neu van con 'suspended' vi ly do khac, resume ngay trong
      // cung gesture nay.
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      refreshAudioBoostToggle();
    };

    function refreshAudioBoostToggle() {
      const btn = document.getElementById('audioBoostToggle');
      if (!btn) return;
      btn.textContent = audioBoostLevel === 1 ? '🔊 Tăng âm' : ('🔊 Tăng âm: x' + audioBoostLevel);
    }

    // Lưu ngay khi rời trang (đóng tab, chuyển trang) — chắc chắn không mất chỗ.
    window.addEventListener('pagehide', () => saveWatchProgress(true));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveWatchProgress(true);
    });

    // Hiện nút "Xem tiếp từ MM:SS" khi mở lại phim đang xem dở.
    function showResumePrompt() {
      if (!(savedResumeTime > 30)) return;       // chưa xem đủ lâu thì thôi
      const v = document.getElementById('videoPlayer');
      if (v && isFinite(v.duration) && v.duration > 0 && savedResumeTime > v.duration - 45) return; // gần hết
      const c = document.querySelector('.player-container');
      if (!c || c.querySelector('.resume-prompt')) return;
      const box = document.createElement('div');
      box.className = 'resume-prompt';
      // Đặt ở GIỮA-TRÊN của khung phim để không đè lên thanh điều khiển ở dưới.
      box.style.cssText = 'position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:31;' +
        'display:flex;gap:8px;align-items:center;justify-content:center;background:rgba(20,20,20,.94);' +
        'color:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.55);' +
        'font-size:14px;max-width:calc(100% - 32px);flex-wrap:wrap;';
      box.innerHTML =
        '<span>Xem tiếp từ <strong>' + formatWatchTime(savedResumeTime) + '</strong>?</span>' +
        '<button class="rp-yes" style="background:var(--accent,#e50914);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;">▶ Xem tiếp</button>' +
        '<button class="rp-no" style="background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;">Xem từ đầu</button>';
      c.appendChild(box);
      const close = () => { box.remove(); };
      box.querySelector('.rp-yes').addEventListener('click', () => {
        const vv = document.getElementById('videoPlayer');
        if (vv) { vv.currentTime = savedResumeTime; vv.play().catch(() => {}); }
        close();
      });
      box.querySelector('.rp-no').addEventListener('click', () => {
        const vv = document.getElementById('videoPlayer');
        if (vv) vv.currentTime = 0;
        close();
      });
      // Tự ẩn sau 12s nếu người xem không chọn (phim cứ chạy tiếp bình thường).
      setTimeout(close, 12000);
    }

    // Vòng đệm chẩn đoán: giữ lại cảnh báo của hls.js để soi khi lỗi xảy ra.
    const audioDiag = [];
    function diag(kind, msg) {
      const v = document.getElementById('videoPlayer');
      audioDiag.push({
        gio: new Date().toISOString().slice(11, 19),
        tai: v && isFinite(v.currentTime) ? +v.currentTime.toFixed(2) : null,
        loai: kind,
        chiTiet: String(msg).slice(0, 300)
      });
      if (audioDiag.length > 300) audioDiag.shift();
    }
    // Gõ __audioDiag() trong Console (F12) để xem nhật ký.
    window.__audioDiag = function () { console.table(audioDiag); return audioDiag; };

    // Logger riêng cho hls.js: chỉ giữ warn/error, phần còn lại no-op cho đỡ ồn.
    // hls.js chấp nhận debug là object nhưng sẽ rơi về console cho hàm nào thiếu,
    // nên phải khai báo đủ cả 6.
    const hlsLogger = {
      trace: function () {}, debug: function () {}, log: function () {}, info: function () {},
      warn: function () { diag('hls.warn', Array.prototype.join.call(arguments, ' ')); },
      error: function () { diag('hls.error', Array.prototype.join.call(arguments, ' ')); }
    };

    function showPlayerError(text) {

    // Dựng lại trình phát = tương đương F5 nhưng KHÔNG mất chỗ đang xem.
    // Thay hẳn thẻ <video> để trình duyệt tạo mới bộ giải mã âm thanh - đây là
    // cách duy nhất chắc chắn xoá được trạng thái decoder đã hỏng.
    function rebuildPlayer() {
      const container = document.querySelector('.player-container');
      if (!container || !currentM3u8Url) return;
      const oldVideo = document.getElementById('videoPlayer');
      pendingResume = oldVideo && isFinite(oldVideo.currentTime) ? oldVideo.currentTime : 0;
      pendingAutoplay = oldVideo ? !oldVideo.paused : true;
      diag('rebuild', 'dung lai player @ ' + pendingResume.toFixed(2) + 's');

      try { if (hlsInstance) hlsInstance.destroy(); } catch (e) {}
      hlsInstance = null;
      try { if (plyrInstance) plyrInstance.destroy(); } catch (e) {}
      plyrInstance = null;
      // Dong AudioContext cu (gan voi <video> sap bi go bo) de khong ro ri -
      // se tao lai AudioContext moi cho <video> moi trong armAudioBoost().
      try { if (audioCtx) audioCtx.close(); } catch (e) {}
      audioCtx = null; audioGainNode = null; audioLimiterNode = null;

      const stale = container.querySelector('.plyr') || container.querySelector('video');
      const fresh = document.createElement('video');
      fresh.id = 'videoPlayer';
      fresh.setAttribute('playsinline', '');
      fresh.setAttribute('webkit-playsinline', '');
      fresh.controls = true;
      if (stale && stale.parentNode) stale.parentNode.replaceChild(fresh, stale);
      else container.insertBefore(fresh, container.firstChild);

      initPlyrPlayer(currentM3u8Url, nextEpUrlGlobal);
    }
    window.rebuildPlayer = rebuildPlayer;

    const SVG_REWIND_ROUND = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4 A8 8 0 1 0 19 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 1 L12 7 L7 4 Z" fill="currentColor"/><text x="12" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="currentColor">10</text></svg>';
    const SVG_FORWARD_ROUND = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4 A8 8 0 1 1 5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 1 L12 7 L17 4 Z" fill="currentColor"/><text x="12" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="currentColor">10</text></svg>';
    const SVG_NEXT = '<svg viewBox="0 0 18 18" fill="currentColor"><path d="M14 4v10h-2V4h2zM4 4l8 5-8 5V4z"/></svg>';

    async function loadWatch() {

      document.getElementById('watchContent').innerHTML =

              '<button id="audioBoostToggle" onclick="cycleAudioBoost()" title="Phim bị nhỏ tiếng? Bấm để tăng âm lượng (chỉ áp dụng cho lần xem này).">🔊 Tăng âm</button>' +

    // Phim "Tên phim (Phần N)" trên phimapi là NHIỀU SLUG/PHIM RIÊNG cho mỗi
    // mùa/phần (khác "tập phim" vốn đã nằm trong server_data của CÙNG 1 phim).
    // Bỏ hậu tố "(Phần N)"/"(Season N)" để ra "tên gốc" dùng so khớp các phần
    // cùng series với nhau.
    // Một số tên phim trên phimapi có ký tự vô hình (zero-width space...) dính
    // ở cuối chuỗi (vd "Medusa (Phần 2)​") khiến regex \s*$ không khớp
    // được - phải lọc bỏ trước khi so khớp, nếu không sẽ bỏ sót cả series.
    function cleanInvisible(s) {
      return String(s || '').replace(/[​-‍﻿]/g, '');
    }
    function stripSeriesSuffix(name) {
      return cleanInvisible(name).replace(/\s*[\(（]\s*(Phần|Season)\s*\d+\s*[\)）]\s*$/, '').trim();
    }
    function extractPartNum(name) {
      const m = cleanInvisible(name).match(/[\(（]\s*(?:Phần|Season)\s*(\d+)\s*[\)）]\s*$/);
      return m ? parseInt(m[1], 10) : null;
    }

    // Phim liên quan: ƯU TIÊN "các phần khác" của CÙNG series (vd phim có
    // Phần 1/2/3/4 thì xem Phần 2 phải thấy đủ Phần 1,3,4), sau đó mới tới
    // phim CÙNG THỂ LOẠI (hoặc CÙNG QUỐC GIA nếu không có thể loại). Dùng lại
    // getFilteredMovies()/renderMovieList() có sẵn - không cần endpoint mới.
    async function loadRelatedMovies(movie) {
      const section = document.getElementById('relatedSection');
      if (!section) return;
      const excludeSlugs = new Set([movie.slug]);
      let seriesCount = 0;
      let categoryCount = 0;

      // --- Khối 1: các phần khác cùng series ---
      try {
        const base = stripSeriesSuffix(movie.name);
        if (base && base !== movie.name) {   // chỉ tìm khi tên có hậu tố "(Phần N)" rõ ràng
          const { items } = await getFilteredMovies({ keyword: base }, 1);
          // So khớp CHÍNH XÁC tên gốc sau khi bỏ hậu tố - tránh dính phim khác
          // chỉ trùng một phần tên (vd "Kyra Và Thế Giới Phép Thuật" khi đang
          // xem "Thế Giới Phép Thuật").
          const siblings = (items || [])
            .filter(m => m.slug !== movie.slug && stripSeriesSuffix(m.name) === base)
            .sort((a, b) => {
              const pa = extractPartNum(a.name), pb = extractPartNum(b.name);
              if (pa != null && pb != null) return pa - pb;
              return (a.year || 0) - (b.year || 0);
            });
          if (siblings.length) {
            siblings.forEach(m => excludeSlugs.add(m.slug));
            renderMovieList(siblings, 'relatedSeriesList');
            document.getElementById('relatedSeriesBlock').style.display = '';
            seriesCount = siblings.length;
          }
        }
      } catch (e) { /* bo qua - khong chan khoi 2 ben duoi */ }

      // --- Khối 2: cùng thể loại (ưu tiên) hoặc cùng quốc gia (fallback) ---
      try {
        const cat = (movie.category && movie.category[0]) || null;
        const country = (movie.country && movie.country[0]) || null;
        if (cat || country) {
          const filters = cat ? { category: cat.slug } : { country: country.slug };
          const { items } = await getFilteredMovies(filters, 1);
          const related = (items || []).filter(m => !excludeSlugs.has(m.slug)).slice(0, 12);
          if (related.length) {
            const titleEl = document.querySelector('#relatedCategoryBlock .section-title');
            if (titleEl) {
              titleEl.textContent = cat
                ? '🎬 Phim cùng thể loại: ' + cat.name
                : '🎬 Phim cùng quốc gia: ' + country.name;
            }
            renderMovieList(related, 'relatedList');
            document.getElementById('relatedCategoryBlock').style.display = '';
            categoryCount = related.length;
          }
        }
      } catch (e) { /* bo qua - khoi series van hien binh thuong neu co */ }

      section.style.display = (seriesCount || categoryCount) ? '' : 'none';
    }

    function setupAfterPlyrReady() {
      const plyrEl = document.querySelector('.plyr');
      const video = document.getElementById('videoPlayer');
      if (!plyrEl || !video) return;

      // Mời "Xem tiếp từ MM:SS" một lần khi mở lại phim đang xem dở.
      if (!resumeOffered) { resumeOffered = true; showResumePrompt(); }

      // SCROLL PROTECTION: Force body scrollable luôn (trừ khi fullscreen)
      // Plyr/HLS có thể set body overflow:hidden ngầm
      function ensureScroll() {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFs) {
          document.body.style.overflow = '';
          document.body.style.overflowY = '';
          document.documentElement.style.overflow = '';
          document.documentElement.style.overflowY = '';
        }
      }
      // Run mỗi 200ms để clear bất kỳ overflow:hidden nào bị set ngầm.
      // Chỉ gắn MỘT lần: rebuildPlayer() gọi lại hàm này nên nếu không chặn thì
      // mỗi lần dựng lại sẽ chồng thêm một interval + một bộ listener nữa.
      if (!scrollGuardInstalled) {
        scrollGuardInstalled = true;
        setInterval(ensureScroll, 200);
        ['play', 'pause', 'click'].forEach(evt => {
          document.addEventListener(evt, ensureScroll, true);
        });
      }
      ensureScroll();

      setTimeout(() => {
        const rewindBtn = plyrEl.querySelector('[data-plyr="rewind"]');
        const forwardBtn = plyrEl.querySelector('[data-plyr="fast-forward"]');
        if (rewindBtn) {
          const tooltip = rewindBtn.querySelector('.plyr__tooltip');
          rewindBtn.innerHTML = SVG_REWIND_ROUND + (tooltip ? tooltip.outerHTML : '<span class="plyr__tooltip" role="tooltip">Lùi 10s</span>');
        }
        if (forwardBtn) {
          const tooltip = forwardBtn.querySelector('.plyr__tooltip');
          forwardBtn.innerHTML = SVG_FORWARD_ROUND + (tooltip ? tooltip.outerHTML : '<span class="plyr__tooltip" role="tooltip">Tiến 10s</span>');
        }

        if (nextEpUrlGlobal || prevEpUrlGlobal) {
          const controls = plyrEl.querySelector('.plyr__controls');
          if (controls) {
            let insertAfter = controls.querySelector('.plyr__volume') || controls.querySelector('[data-plyr="mute"]');
            if (insertAfter) {
              while (insertAfter.parentNode && insertAfter.parentNode !== controls) {
                insertAfter = insertAfter.parentNode;
              }
              if (prevEpUrlGlobal) {
                const prevBtn = document.createElement('button');
                prevBtn.type = 'button';
                prevBtn.className = 'plyr__control plyr__control--prev';
                prevBtn.setAttribute('aria-label', 'Tập trước');
                prevBtn.innerHTML = SVG_PREV + '<span class="plyr__tooltip" role="tooltip">Tập trước</span>';
                prevBtn.addEventListener('click', (e) => {
                  e.preventDefault();
                  window.location.href = prevEpUrlGlobal;
                });
                insertAfter.parentNode.insertBefore(prevBtn, insertAfter.nextSibling);
                insertAfter = prevBtn;
              }
              if (nextEpUrlGlobal) {
                const nextBtn = document.createElement('button');
                nextBtn.type = 'button';
                nextBtn.className = 'plyr__control plyr__control--next';
                nextBtn.setAttribute('aria-label', 'Tập sau');
                nextBtn.innerHTML = SVG_NEXT + '<span class="plyr__tooltip" role="tooltip">Tập sau</span>';
                nextBtn.addEventListener('click', (e) => {
                  e.preventDefault();
                  window.location.href = nextEpUrlGlobal;
                });
                insertAfter.parentNode.insertBefore(nextBtn, insertAfter.nextSibling);
              }
            }
          }
        }
      }, 100);
    }

    function initPlyrPlayer(m3u8Url, nextEpUrl) {
      const video = document.getElementById('videoPlayer');
      armAdSkip(video);
      armHistorySave(video);
      // KHONG goi armAudioBoost() o day, KHONG CO NGOAI LE - kem ca khi dang
      // dung lai player ("Sua tieng") luc audioBoostLevel > 1. Ly do: rebuild
      // co the bi kich hoat TU DONG (khong phai nguoi bam nut) tu vong lap
      // phuc hoi loi MEDIA_ERROR cua hls.js (xem 'setTimeout(rebuildPlayer, 0)'
      // ben duoi) - luc do KHONG co user-gesture nao ca, tao AudioContext se
      // lai dinh dung bay 'suspended' vinh vien -> MAT TIENG. Danh doi: neu
      // dang bat Tang am ma player bi dung lai, phai bam lai nut 1 lan - doi
      // lay viec KHONG BAO GIO co duong nao tao AudioContext ngoai mot cu chi
      // bam nut THAT (chi xay ra trong cycleAudioBoost()).
      currentM3u8Url = m3u8Url;
      const resumeAt = pendingResume;
      const resumePlay = pendingAutoplay;
      pendingResume = 0;
      pendingAutoplay = false;

      if (!m3u8Url) { showPlayerError('Tập này chưa có link xem.'); return; }

      // Phải ưu tiên hls.js: Chrome/Edge/Firefox trả về "maybe" cho canPlayType HLS
      // nhưng KHÔNG phát được HLS natively (video.error code 4). Chỉ dùng native khi
      // hls.js không chạy được - tức Safari/iOS, nơi native HLS mới thực sự hoạt động.
      if (!Hls.isSupported()) {
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = m3u8Url;
          plyrInstance = new Plyr(video, getPlyrConfig());
          plyrInstance.on('ready', setupAfterPlyrReady);
          if (nextEpUrl) plyrInstance.on('ended', () => { window.location.href = nextEpUrl; });
          if (resumeAt > 0) {
            video.addEventListener('loadedmetadata', () => {
              video.currentTime = resumeAt;
              if (resumePlay) video.play().catch(() => {});
            }, { once: true });
          }
          return;
        }
        showPlayerError('Trình duyệt không hỗ trợ HLS.');
        return;
      }

      hlsInstance = new Hls({
        capLevelToPlayerSize: false,
        startLevel: -1,
        // Master m3u8 của CDN KHÔNG khai báo CODECS, nên hls.js không biết luồng này
        // là AAC-LC. Khi vá khe hở ~60-90ms ở các điểm nối quảng cáo (đo được: 7 lần
        // quanh phút 2:57, thêm 2 lần ở 14:58 và 15:28), nó gọi
        // getSilentFrame(manifestCodec || track.codec). manifestCodec = undefined và
        // track.codec bị Chrome ép thành 'mp4a.40.5', nên rơi vào nhánh default và
        // chèn nhầm frame câm HE-AAC v2 vào luồng AAC-LC.
        // Khai báo mặc định AAC-LC để frame chèn đúng loại.
        // ĐÃ KIỂM CHỨNG trên Chrome thật: dòng này KHÔNG đổi codec của SourceBuffer
        // (vẫn mp4a.40.5) và không đổi parsed codec - chỉ đổi frame câm được chèn.
        defaultAudioCodec: 'mp4a.40.2',
        startPosition: resumeAt > 0 ? resumeAt : -1,
        debug: hlsLogger
      });
      hlsInstance.loadSource(m3u8Url);
      hlsInstance.attachMedia(video);

      // Tính lại vùng quảng cáo mỗi khi playlist tải xong. Đọc fragments từ payload
      // sự kiện (không từ hls.levels[currentLevel]) để chạy đúng cả khi currentLevel=-1
      // và tự tính lại khi đổi chất lượng.
      hlsInstance.on(Hls.Events.LEVEL_LOADED, (e, data) => {
        try {
          const frags = data && data.details && data.details.fragments;
          adRanges = computeAdRanges(frags || []);
          diag('adskip', 'vung QC=' + JSON.stringify(adRanges.map(r => [+r.start.toFixed(1), +r.end.toFixed(1)])));
        } catch (err) { diag('adskip.err', err && err.message); }
      });
      hlsInstance.on(Hls.Events.LEVEL_UPDATED, (e, data) => {
        try {
          const frags = data && data.details && data.details.fragments;
          if (frags && frags.length) adRanges = computeAdRanges(frags);
        } catch (err) {}
      });

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        const availableQualities = hlsInstance.levels.map(l => l.height).filter(h => h > 0).sort((a, b) => b - a);
        const uniqueQualities = [...new Set(availableQualities)];
        const qualities = uniqueQualities.length > 1 ? [0].concat(uniqueQualities) : uniqueQualities;
        const config = getPlyrConfig();
        if (qualities.length > 1) {
          config.quality = {
            default: 0, options: qualities, forced: true,
            onChange: (newQuality) => {
              if (newQuality === 0) { hlsInstance.currentLevel = -1; }
              else {
                hlsInstance.levels.forEach((level, idx) => {
                  if (level.height === newQuality) hlsInstance.currentLevel = idx;
                });
              }
            }
          };
          config.i18n = Object.assign(config.i18n || {}, { qualityLabel: { 0: 'Auto' } });
          config.settings = ['quality', 'speed'];
        } else {
          config.settings = ['speed'];
        }
        plyrInstance = new Plyr(video, config);
        plyrInstance.on('ready', setupAfterPlyrReady);
        if (nextEpUrl) plyrInstance.on('ended', () => { window.location.href = nextEpUrl; });
        if (resumePlay) video.play().catch(() => {});
      });

      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        // Ghi lại MỌI lỗi (kể cả non-fatal) để chẩn đoán, nhưng chỉ XỬ LÝ lỗi fatal.
        // Cố "sửa" lỗi non-fatal sẽ phá cơ chế tự phục hồi sẵn có của hls.js.
        diag(data.fatal ? 'fatal' : 'nonfatal', data.type + ' / ' + data.details);
        if (!data.fatal) return;

        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR: {
            // Giữ hành vi cũ nhưng chặn vòng lặp thử lại liên tục.
            const now = Date.now();
            if (now - lastNetworkRetry < 1000) return;
            lastNetworkRetry = now;
            hlsInstance.startLoad();
            break;
          }
          case Hls.ErrorTypes.MEDIA_ERROR: {
            // Mẫu chính thức của hls.js: debounce 5000ms rồi leo thang.
            // KHÔNG dùng swapAudioCodec(): nó đã bị deprecate và với stream này
            // sẽ lật codec sang mp4a.40.5 -> báo sai 88200Hz -> gây đúng lỗi
            // tiếng méo mà ta đang chữa.
            const now = Date.now();
            if (now - lastMediaRecover > 5000) {
              lastMediaRecover = now;
              mediaRecoverCount = 1;
              hlsInstance.recoverMediaError();
            } else if (mediaRecoverCount === 1) {
              lastMediaRecover = now;
              mediaRecoverCount = 2;
              setTimeout(rebuildPlayer, 0);   // tương đương F5, không mất chỗ xem
            } else {
              setTimeout(() => {
                try { if (hlsInstance) hlsInstance.destroy(); } catch (e) {}
                showPlayerError('Không phát được video. Vui lòng tải lại trang (F5).');
              }, 0);
            }
            break;
          }
          default:
            setTimeout(() => {
              try { if (hlsInstance) hlsInstance.destroy(); } catch (e) {}
              showPlayerError('Không phát được video.');
            }, 0);
        }
      });
    }

    function getPlyrConfig() {
      return {
        controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
        settings: ['quality', 'speed'],
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
        seekTime: 10,
        clickToPlay: true,
        keyboard: { focused: true, global: true },
        tooltips: { controls: true, seek: true },
        i18n: {
          restart: 'Phát lại', rewind: 'Lùi 10s', play: 'Phát', pause: 'Tạm dừng',
          fastForward: 'Tiến 10s', seek: 'Tua', played: 'Đã xem', buffered: 'Đã tải',
          currentTime: 'Hiện tại', duration: 'Tổng thời lượng', volume: 'Âm lượng',
          mute: 'Tắt tiếng', unmute: 'Bật tiếng', download: 'Tải xuống',
          enterFullscreen: 'Toàn màn hình', exitFullscreen: 'Thoát toàn màn hình',
          settings: 'Cài đặt', pip: 'PIP', menuBack: 'Quay lại',
          speed: 'Tốc độ', normal: 'Bình thường', quality: 'Chất lượng', loop: 'Lặp lại'
        }
      };
    }

    function renderEpisodes(episodes, currentEpSlug, currentServerIdx) {
      if (!episodes || episodes.length === 0) return '';
      const tabs = episodes.map((server, idx) =>
        '<button class="server-tab ' + (idx === currentServerIdx ? 'active' : '') + '" data-idx="' + idx + '">' + server.server_name + '</button>'
      ).join('');
      const lists = episodes.map((server, idx) => {
        const epsHtml = (server.server_data || []).map(ep =>
          '<a href="watch.html?slug=' + slug + '&ep=' + encodeURIComponent(ep.slug) + '&server=' + idx + '" class="episode-btn ' + (ep.slug === currentEpSlug ? 'active' : '') + '">' + ep.name + '</a>'
        ).join('');
        return '<div class="episode-list" data-idx="' + idx + '" style="' + (idx === currentServerIdx ? '' : 'display:none') + '">' + epsHtml + '</div>';
      }).join('');
      return '<div class="episodes-section"><h2 class="section-title" style="margin-top:0;">Danh sách tập</h2><div class="server-tabs">' + tabs + '</div>' + lists + '</div>';
    }

    function bindServerTabs() {
      document.querySelectorAll('.server-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const idx = tab.dataset.idx;
          document.querySelectorAll('.server-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.episode-list').forEach(list => {
            list.style.display = list.dataset.idx === idx ? '' : 'none';
          });
        });
      });
    }
  </script>
</body>
</html>
